syntax = "proto3";

package sms_gw.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "sms_gw/service/v1/common.proto";

// TemplateService — admin CRUD for message templates. Templates are
// rendered at Send time using Go text/template; the rendered output
// becomes the SMS body. The template_id field on SendSmsRequest selects
// which template renders.
service TemplateService {
  rpc List(PagingRequest) returns (ListTemplateResponse) {
    option (google.api.http) = {get: "/v1/templates"};
  }
  rpc Get(GetTemplateRequest) returns (GetTemplateResponse) {
    option (google.api.http) = {get: "/v1/templates/{id}"};
  }
  rpc Create(CreateTemplateRequest) returns (Template) {
    option (google.api.http) = {
      post: "/v1/templates"
      body: "*"
    };
  }
  rpc Update(UpdateTemplateRequest) returns (Template) {
    option (google.api.http) = {
      put: "/v1/templates/{id}"
      body: "*"
    };
  }
  rpc Delete(DeleteTemplateRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/templates/{id}"};
  }
}

message Template {
  uint32 id = 1;
  string name = 2;
  ObjectType object_type = 3;
  // Map of named template fragments. SMS rendering requires the "body" key.
  // Other keys are reserved for future channels (subject for email, etc.).
  map<string, string> templates = 4;
  string status = 5;
  optional google.protobuf.Timestamp create_time = 30 [json_name = "createTime"];
  optional google.protobuf.Timestamp update_time = 31 [json_name = "updateTime"];
}

message ListTemplateResponse {
  repeated Template items = 1;
  int32 total = 2;
}

message GetTemplateRequest {
  uint32 id = 1;
}

message GetTemplateResponse {
  Template data = 1;
}

message CreateTemplateRequest {
  string name = 1;
  ObjectType object_type = 2;
  map<string, string> templates = 3;
  string status = 4;
}

message UpdateTemplateRequest {
  uint32 id = 1;
  optional string name = 2;
  optional ObjectType object_type = 3;
  map<string, string> templates = 4;
  optional string status = 5;
}

message DeleteTemplateRequest {
  uint32 id = 1;
}
