# go-tangra-sms-gw CI (go-tangra v4), on the v4 branch; main keeps the v3 code and workflow.
#
# Images: ghcr.io/go-tangra/go-tangra-sms-gw tagged <version>, <major>.<minor>, <major> (from tags vX.Y.Z)
# and sha-<short> (v4 branch pushes and tags). There is deliberately NO `latest`,
# NO branch tag and NO registry cleanup job: the v3.x images published by the old
# workflow must stay available.
#
# The tag filter 'v*' is a glob anchored at the start of the tag name (`*` does not
# cross `/`), so an `sdk/v4.0.0` tag never builds or pushes an image.
#
# Credentials: the only secret used is GITHUB_TOKEN (npm read for @go-tangra/* and
# GHCR push). It reaches the image build as the BuildKit secret `npm_token`, which is
# mounted for `npm ci` only and never lands in a layer, log or artifact. Tests use
# throwaway keys generated at run time and a mock carrier; no carrier is contacted.
name: CI

on:
  push:
    branches:
      - v4
    tags:
      - 'v*'
  pull_request:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/go-tangra/go-tangra-sms-gw

jobs:
  go:
    name: Go vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal pkg api tests ui/*.go | grep -v '^tests/fixtures/')"

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./...

  contract:
    name: Contract + manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      # Manifest/OpenAPI/handler parity, module roles and the role matrix.
      - name: Manifest and OpenAPI parity
        run: go test -count=1 -run 'TestRoles|TestRegistration|TestManifest|TestHandlerManifestParity|TestRoleMatrix' ./pkg/smsgwmanifest/ ./internal/httpapi/

  integration:
    name: PostgreSQL integration + contract replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      # testcontainers starts postgres:16 and pebble on the runner's docker;
      # SMSGW_TEST_REQUIRE_DOCKER turns a missing container into a failure
      # instead of a skip.
      - name: go test -race -tags integration
        run: go test -race -tags integration -count=1 -timeout 30m ./...
        env:
          SMSGW_TEST_REQUIRE_DOCKER: '1'

  ui:
    name: UI lint + unit tests + build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      - name: npm ci
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: API types match the OpenAPI contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts

      - name: Lint + typecheck
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      # The built mf-manifest.json agrees with pkg/smsgwmanifest.
      - name: Built remote matches the manifest
        run: go test -count=1 -tags ui ./ && go test -count=1 ./

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - go
      - contract
      - integration
      - ui
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (push on tags and v4 pushes only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
