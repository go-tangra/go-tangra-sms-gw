# Development configuration for the sms-gw module on the platform stack.
# Never use these values outside a workstation. Secrets are references:
# deploy/kek.dev and deploy/jwt.dev.key are generated locally (gitignored).
service_name: sms-gw
trust_domain: example.org
env: dev
identity:
  provider: file
  file: { cert: ../../.dev/ca/sms-gw.pem, key: ../../.dev/ca/sms-gw.key, bundle: ../../.dev/ca/ca.pem }
authz: { source: file, path: deploy/policy.yaml }
# Mesh listeners (mTLS, reached only through the gateway) and the admin
# listener (health, readiness, metrics) stay on loopback.
server: { grpc_addr: 127.0.0.1:9983, http_addr: 127.0.0.1:9984 }
admin: { addr: 127.0.0.1:9593 }
discovery:
  static:
    gateway: ["127.0.0.1:9643"]
    auth: ["127.0.0.1:9543"]
db:
  dsn: postgres://smsgw_app:dev@127.0.0.1:5437/sms_gw?sslmode=disable
  migrate_dsn: postgres://postgres:dev@127.0.0.1:5437/sms_gw?sslmode=disable
  max_conns: 16
kek:
  source: file
  path: deploy/kek.dev
gateway:
  service: gateway
  issuer: https://localhost:8443
  auth_service: auth
# Multi-host deployments enroll for the mesh SVID over lcm instead
# (identity.provider: provided).
enroll:
  enabled: false
# Legacy Hermes edge: separate listener, its own authentication and keys.
# Legacy HTTP_PUBLIC_BIND / SMS_GW_TLS_* variables override these values.
public:
  http_addr: 127.0.0.1:9901
  https_addr: 127.0.0.1:9902
  trusted_proxies: []
  max_body_bytes: 65536
public_auth:
  jwt_secret: { file: deploy/jwt.dev.key }
  access_ttl_seconds: 7200
  refresh_ttl_seconds: 604800
acme:
  enabled: false
rate_limits:
  login_per_minute: 10
  login_burst: 5
  send_per_minute: 100
  send_burst: 20
  dlr_per_minute: 500
  dlr_burst: 100
recipients:
  min_digits: 7
  allowed_prefixes: []
  blocked_prefixes: []
webhook:
  allow_http: true    # local callback receivers (development only)
  allow_private: true # loopback receivers (development only)
  queue_size: 4096
  workers: 4
retention:
  interval: 1h
monitoring:
  prometheus_url: ""
query:
  default_page_size: 50
  max_page_size: 500
