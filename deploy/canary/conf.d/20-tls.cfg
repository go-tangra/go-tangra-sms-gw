# Public TLS edge: terminates HTTPS on :443 with v3's certificate and hands
# the decrypted stream to frontend sms_public (10-canary.cfg) over the
# container's own loopback, with PROXY v2 so the client address survives.
#
# Same TLS surface as v3's Go server: TLS 1.2 minimum (ssl-default-bind-*
# in 10-canary.cfg) and ALPN h2,http/1.1 — Go's net/http offers both
# when TLSConfig.NextProtos is empty, which is what v3 (kratos) does. The
# HTTP frontend detects the HTTP/2 preface on its loopback bind by itself.
#
# Environment:
#   CANARY_TLS_BIND   e.g. :443
#   CANARY_TLS_PEM    combined certificate chain + private key (entrypoint.sh
#                     builds it from v3's separate cert/key files)

defaults tls_edge
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 35s
    timeout server 35s

frontend sms_tls from tls_edge
    # Log failed connections (TLS handshake errors) only; requests are
    # logged by sms_public.
    option dontlog-normal
    bind "${CANARY_TLS_BIND}" ssl crt "${CANARY_TLS_PEM}" alpn h2,http/1.1
    default_backend sms_tls_to_http

backend sms_tls_to_http from tls_edge
    server http "${CANARY_PROXY_BIND}" send-proxy-v2
