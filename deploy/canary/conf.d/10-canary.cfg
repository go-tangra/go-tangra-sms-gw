# sms-gw V3 -> V4 canary load balancer (HAProxy 2.8)
#
# Based on the user's draft; every deviation from it is marked "CHANGED:" and
# listed in deploy/canary/README.md ("Review of the draft").
#
# Both versions run side by side with SEPARATE databases. Every request is
# routed so that the instance which owns the data always answers:
#
#   1. Message-addressed requests route by the message UUID's version nibble.
#      V3 mints UUIDv4 (uuid.New), V4 MUST mint UUIDv7 (uuid.NewV7). So a
#      message id or DLR request_id of the form xxxxxxxx-xxxx-7xxx-[89ab]xxx-
#      xxxxxxxxxxxx was created by V4, every other UUID by V3. This covers:
#        GET  /hermes/v1/sms/{id}        GET /v1/sms/{id}
#        GET  /hermes/v1/sms/dlr/{id}    GET /v1/sms/dlr/{id}
#        GET  /dlr?request_id=...        GET /hermes/v1/sms/dlr?request_id=...
#        (requestId= is accepted too: both versions bind the query by the
#        proto field name and its JSON name)
#      History stays readable after a client moves from V3 to V4.
#
#   2. Client-addressed requests stick per API client (JWT/login username):
#        pins.map   explicit override (username -> v3|v4)
#        canary.map "percent N": username hashes into bucket 0..99, buckets
#                   below N go to V4. Raising N only moves clients V3 -> V4,
#                   never back, so a client never flaps between versions.
#      If V4 has no healthy server, client-addressed traffic falls back to V3.
#      The decision is taken before the request is sent, so a send is never
#      sent twice; it is safe for tokens only because both versions share the
#      JWT secret (a V4-issued token is valid on V3 and vice versa).
#
#   3. Everything else (anonymous, /health, /metrics, assets, unknown) -> V3.
#
# The JWT is NOT verified here; it only selects a backend. Both backends
# verify the signature, so a forged token can at most pick the wrong
# instance and then fail auth there.
#
# Runtime changes: edit canary.map / pins.map and reload (SIGUSR2 to the
# master, haproxy -W), see deploy/canary/sms-canary.sh. The map files are the
# only state; the reload is hitless (listeners pass to the new worker) and
# server health survives it (server-state-file).
#
# Environment (defaults are set by entrypoint.sh / test.sh):
#   SMS_GW_V3_ADDR       v3 plain HTTP, e.g. <v3-container>:9901
#   SMS_GW_V4_ADDR       v4 plain HTTP, e.g. <v4-container>:9901
#   CANARY_MAP_DIR       directory holding pins.map and canary.map
#   CANARY_RUN_DIR       directory for the runtime API socket (admin.sock)
#   CANARY_HTTP_BIND     plain frontend bind (container-internal, never published)
#   CANARY_PROXY_BIND    loopback bind the TLS frontend forwards to (PROXY v2)
#   CANARY_STATS_BIND    stats page bind (loopback only)
#   CANARY_DNS           resolver for backend names (Docker: 127.0.0.11:53)
#   CANARY_DROP_USER     optional: user to drop to after start (prod: haproxy)
#   CANARY_DEBUG         optional: if set, X-Sms-Gw-Debug: 1 echoes the route

global
    log stdout format raw local0 info
    # CHANGED: socket in a host-mounted run dir so sms-canary.sh can read
    # `show stat` from the host (was /tmp/haproxy.sock inside the container).
    stats socket "${CANARY_RUN_DIR}/admin.sock" mode 600 level admin expose-fd listeners
    stats timeout 30s
    # CHANGED: health state is carried across reloads (sms-canary.sh dumps it
    # right before SIGUSR2). Without it a fresh worker starts with V4 "UP"
    # even when V4 is down, and V4 clients get 503 instead of the V3
    # fallback until the checks fail again (~15 s).
    server-state-file "${CANARY_RUN_DIR}/servers.state"
    # CHANGED: login/refresh bodies up to the services' 64 KiB cap must fit in
    # one buffer to be inspected (default bufsize is 16 KiB).
    tune.bufsize 81920
    # TLS like v3's Go server (go1.25 crypto/tls defaults): TLS 1.2 minimum,
    # TLS 1.2 limited to Go's default ECDHE AEAD + CBC-SHA suites.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    # CHANGED: HTTP/1 responses keep the header-name case the Go backends
    # send (HAProxy lower-cases them otherwise), so clients see no change.
    h1-case-adjust content-type Content-Type
    h1-case-adjust content-length Content-Length
    h1-case-adjust date Date
    h1-case-adjust vary Vary
    h1-case-adjust accept-ranges Accept-Ranges
    h1-case-adjust last-modified Last-Modified
    h1-case-adjust cache-control Cache-Control
    h1-case-adjust location Location
    h1-case-adjust connection Connection
    h1-case-adjust keep-alive Keep-Alive
    h1-case-adjust transfer-encoding Transfer-Encoding
    h1-case-adjust www-authenticate Www-Authenticate
    h1-case-adjust x-content-type-options X-Content-Type-Options
    h1-case-adjust etag Etag
.if defined(CANARY_DROP_USER)
    # Prod: the container starts as root (to read the root-only certificate
    # mount), then the workers drop to this user.
    user "${CANARY_DROP_USER}"
    group "${CANARY_DROP_USER}"
.endif

# Docker's embedded DNS. Backends are re-resolved at runtime, so the
# balancer starts even while V4 is stopped (V4 just stays DOWN and
# client traffic falls back to V3) and follows container IP changes.
resolvers docker
    nameserver dns "${CANARY_DNS}"
    hold valid 10s

defaults
    mode http
    log global
    option forwardfor
    # CHANGED: no "option http-buffer-request" here (it buffered every request,
    # sends included); the frontend waits for the body only on login/refresh.
    option log-health-checks
    load-server-state-from-file global
    timeout connect 5s
    timeout client 35s
    timeout server 35s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout check 2s
    # Connection failures only (the request never reached the backend), and
    # never to the other version: each backend has a single server.
    retries 2
    default-server init-addr last,libc,none resolvers docker
    # Log which version answered and why, for canary dashboards.
    # CHANGED: method + path only (%HPO) instead of the request line, so DLR
    # query strings (phone numbers, statuses) and ids in queries stay out of
    # the log; user is the unverified JWT/login username (sanitised below).
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc/%rc \"%HM %HPO %HV\" route=%[var(txn.route)] user=%[var(txn.user)]"
    # CHANGED: errors generated by the balancer itself are the services' JSON
    # error shape, not HAProxy-branded HTML.
    http-error status 400 content-type "application/json" string "{\"code\":400,\"reason\":\"BAD_REQUEST\",\"message\":\"bad request\",\"metadata\":{}}"
    http-error status 403 content-type "application/json" string "{\"code\":403,\"reason\":\"FORBIDDEN\",\"message\":\"forbidden\",\"metadata\":{}}"
    http-error status 408 content-type "application/json" string "{\"code\":408,\"reason\":\"REQUEST_TIMEOUT\",\"message\":\"request timeout\",\"metadata\":{}}"
    http-error status 500 content-type "application/json" string "{\"code\":500,\"reason\":\"UNKNOWN\",\"message\":\"unknown request error\",\"metadata\":{}}"
    http-error status 502 content-type "application/json" string "{\"code\":502,\"reason\":\"BAD_GATEWAY\",\"message\":\"bad gateway\",\"metadata\":{}}"
    http-error status 503 content-type "application/json" string "{\"code\":503,\"reason\":\"SERVICE_UNAVAILABLE\",\"message\":\"service unavailable\",\"metadata\":{}}"
    http-error status 504 content-type "application/json" string "{\"code\":504,\"reason\":\"GATEWAY_TIMEOUT\",\"message\":\"gateway timeout\",\"metadata\":{}}"

frontend sms_public
    # Container-internal plain listener. NEVER publish it on the host: host
    # ports 9900/9901 stay with the v3 container (the v3 portal uses them).
    bind "${CANARY_HTTP_BIND}"
    # Internal loopback for the TLS frontend (20-tls.cfg), which
    # forwards here with PROXY v2 so the real client IP survives.
    bind "${CANARY_PROXY_BIND}" accept-proxy
    monitor-uri /lb-health
    option h1-case-adjust-bogus-client

    # This balancer is the edge: client-supplied forwarding headers are
    # dropped, otherwise a client could pick its own per-IP rate-limit
    # bucket and audit IP (the backends trust these headers from us).
    # option forwardfor then appends the real peer address.
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request set-header X-Real-IP %[src]

    # CHANGED: full, anchored UUIDs (the draft's prefix match also caught
    # /hermes/v1/sms/12345678-1234-7xyz/... and any id merely starting
    # like a UUID). v7 also requires the RFC 4122 variant nibble.
    acl v7_id_path   path_reg ^/(hermes/)?v1/sms/(dlr/)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    acl id_path      path_reg ^/(hermes/)?v1/sms/(dlr/)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    acl dlr_path     path /dlr /hermes/v1/sms/dlr
    acl v7_dlr       url_param(request_id) -m reg ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    acl v7_dlr_camel url_param(requestId)  -m reg ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    acl login_path   path /hermes/v1/login
    acl refresh_path path /hermes/v1/refresh_token
    acl logout_path  path /hermes/v1/logout
    # Both services pick the body codec by Content-Type: form iff the subtype
    # is x-www-form-urlencoded, JSON otherwise.
    acl form_body    req.hdr(content-type) -m sub -i x-www-form-urlencoded
    acl v4_up        nbsrv(sms_v4) gt 0

    # CHANGED: wait for the body only where it carries the sticky key.
    http-request wait-for-body time 10s at-least 64k if METH_POST login_path || METH_POST refresh_path

    # --- 1. message-addressed: route by UUID version ---------------------
    # No V4-down fallback here: V3 does not have these messages.
    http-request set-var(txn.route) str(dlr-v4) if dlr_path v7_dlr || dlr_path v7_dlr_camel
    http-request set-var(txn.route) str(dlr-v3) if dlr_path !{ var(txn.route) -m found }
    http-request set-var(txn.route) str(id-v4)  if v7_id_path
    http-request set-var(txn.route) str(id-v3)  if id_path !v7_id_path

    # --- 2. client-addressed: resolve the sticky key ---------------------
    # CHANGED: login/refresh read the body first (an Authorization header on
    # login is ignored by the services), form bodies are url-decoded, the
    # refresh token is also read from form bodies, and logout falls back to
    # X-Refresh-Token.
    http-request set-var(txn.user) req.body,json_query('$.username') if METH_POST login_path !form_body
    http-request set-var(txn.user) req.body_param(username),url_dec(1) if METH_POST login_path form_body
    http-request set-var(txn.rt) req.body,json_query('$.refresh_token') if METH_POST refresh_path !form_body
    http-request set-var(txn.rt) req.body,json_query('$.refreshToken') if METH_POST refresh_path !form_body !{ var(txn.rt) -m found }
    http-request set-var(txn.rt) req.body_param(refresh_token),url_dec(1) if METH_POST refresh_path form_body
    http-request set-var(txn.rt) req.body_param(refreshToken),url_dec(1) if METH_POST refresh_path form_body !{ var(txn.rt) -m found }
    http-request set-var(txn.user) var(txn.rt),jwt_payload_query('$.username') if { var(txn.rt) -m found }
    http-request set-var(txn.user) http_auth_bearer,jwt_payload_query('$.username') if !{ var(txn.route) -m found } !login_path !refresh_path { http_auth_bearer -m found }
    http-request set-var(txn.user) req.hdr(X-Refresh-Token),jwt_payload_query('$.username') if logout_path !{ var(txn.user) -m found }
    # CHANGED: only usernames sms-canary.sh can pin (^[A-Za-z0-9._@+-]{1,128}$)
    # are sticky keys; anything else is dropped so it can neither be logged
    # raw (log injection) nor hashed into a V4 bucket, and takes the V3 default.
    http-request unset-var(txn.user) if { var(txn.user) -m found } !{ var(txn.user) -m reg '^[A-Za-z0-9._@+-]{1,128}$' }

    http-request set-var(txn.pin)    var(txn.user),map("${CANARY_MAP_DIR}/pins.map") if { var(txn.user) -m found }
    http-request set-var(txn.pct)    str(percent),map("${CANARY_MAP_DIR}/canary.map",0)
    http-request set-var(txn.bucket) var(txn.user),crc32,mod(100) if { var(txn.user) -m found }

    http-request set-var(txn.route) str(pin-v4)    if !{ var(txn.route) -m found } { var(txn.pin) -m str v4 } v4_up
    http-request set-var(txn.route) str(pin-v3)    if !{ var(txn.route) -m found } { var(txn.pin) -m str v3 }
    http-request set-var(txn.route) str(bucket-v4) if !{ var(txn.route) -m found } !{ var(txn.pin) -m found } { var(txn.bucket),sub(txn.pct) -m int lt 0 } v4_up
    # V4 down: clients that would go to V4 are served by V3 (logged as such).
    http-request set-var(txn.route) str(fallback-v3) if !{ var(txn.route) -m found } { var(txn.pin) -m str v4 } !v4_up
    http-request set-var(txn.route) str(fallback-v3) if !{ var(txn.route) -m found } !{ var(txn.pin) -m found } { var(txn.bucket),sub(txn.pct) -m int lt 0 } !v4_up
    http-request set-var(txn.route) str(default-v3) if !{ var(txn.route) -m found }

    # Routing decision is echoed only on request (X-Sms-Gw-Debug: 1), so
    # canary state is not advertised to every client.
    # CHANGED: and only when the balancer runs with CANARY_DEBUG set; the
    # request header is never forwarded to the backends.
.if defined(CANARY_DEBUG)
    http-request set-var(txn.debug) bool(true) if { req.hdr(X-Sms-Gw-Debug) -m str 1 }
    http-response set-header X-Sms-Gw-Route %[var(txn.route)] if { var(txn.debug) -m bool }
.endif
    http-request del-header X-Sms-Gw-Debug

    use_backend sms_v4 if { var(txn.route) -m reg v4$ }
    default_backend sms_v3

backend sms_v3
    option httpchk GET /health
    http-check expect status 200
    server v3 "${SMS_GW_V3_ADDR}" check inter 5s fall 3 rise 2

backend sms_v4
    option httpchk GET /health
    http-check expect status 200
    server v4 "${SMS_GW_V4_ADDR}" check inter 5s fall 3 rise 2

# CHANGED: loopback only and never published (was :8404 on every
# interface). sms-canary.sh status reads `show stat` from the admin socket.
listen stats
    bind "${CANARY_STATS_BIND}"
    stats enable
    stats uri /stats
    stats refresh 10s
